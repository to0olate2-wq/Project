name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases (one-tap updates read the latest release)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Google Play upload key, from the repository's secrets (Settings → Secrets and variables → Actions).
      # Without it the Play bundle is built unsigned.
      - name: Play upload key
        env:
          PLAY_KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_B64 }}
        run: |
          if [ -n "$PLAY_KEYSTORE_B64" ]; then
            echo "$PLAY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PLAY_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Play bundle will be signed with the upload key."
          else
            echo "::notice::No PLAY_KEYSTORE_B64 secret: the Play bundle is built unsigned."
          fi

      - name: Build APK (GitHub) and bundle (Google Play)
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Name the APK and bundle
        run: |
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/github/release/*.apk "out/ThePlayer-$VNAME-build${{ github.run_number }}.apk"
          SUFFIX=play
          [ -n "$PLAY_KEYSTORE_FILE" ] || SUFFIX=play-unsigned
          cp app/build/outputs/bundle/playRelease/*.aab "out/ThePlayer-$VNAME-build${{ github.run_number }}-$SUFFIX.aab"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ThePlayer-build
          path: out/*

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "build-${{ github.run_number }}" out/*.apk out/*.aab \
            --target "${{ github.sha }}" \
            --title "The Player $VNAME (build ${{ github.run_number }})" \
            --notes-file notes.txt \
            --latest

  # Draws the main screens with sample data (Robolectric) and publishes them to the
  # "screenshots" branch, for reviewing layout without a device. Never blocks a release.
  screens:
    runs-on: ubuntu-latest
    continue-on-error: true
    # A stuck screen test must not hold a runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Draw the screens
        continue-on-error: true
        timeout-minutes: 14
        run: |
          chmod +x gradlew
          ./gradlew testPlayDebugUnitTest --no-daemon --stacktrace 2>&1 | tee screens.log | tail -60

      - name: Publish to the screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/screens
          cp app/build/screens/*.png /tmp/screens/ 2>/dev/null || true
          grep -E "^e: |^w: .*screens|STARTED|PASSED|FAILED|SKIPPED|Exception|Error:|at app\.falak|Caused by" screens.log | head -80 > /tmp/screens/log.txt || true
          find app/build/test-results -name "*.xml" -exec cp {} /tmp/screens/ \; 2>/dev/null || true
          cd /tmp/screens
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -q -m "Screens for build ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
