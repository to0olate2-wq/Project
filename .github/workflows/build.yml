name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases (one-tap updates read the latest release)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Name the APK
        run: |
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/github/release/*.apk "out/ThePlayer-$VNAME-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ThePlayer-apk
          path: out/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --target "${{ github.sha }}" \
            --title "The Player $VNAME (build ${{ github.run_number }})" \
            --notes-file notes.txt \
            --latest
