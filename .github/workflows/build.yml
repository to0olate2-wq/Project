name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases (one-tap updates read the latest release)

jobs:
  # The user counter (stats/), deployed to the owner's Cloudflare account when the repository has
  # the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (STATS_PASSWORD locks its page).
  # Without them nothing is deployed and the app is built without counting.
  stats:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy the user counter
        id: deploy
        continue-on-error: true
        working-directory: stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet: the user counter isn't deployed and the app counts nothing."
            exit 0
          fi
          # A new Cloudflare account has no workers.dev address yet: make one.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            sub="theplayer-$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -c1-8)"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$sub\"}" "$api" | jq -c '{success, errors}'
          fi
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::The user counter didn't deploy: check the Cloudflare token and account ID."
            exit 1
          fi
          if [ -n "$STATS_PASSWORD" ]; then
            printf '%s' "$STATS_PASSWORD" | npx --yes wrangler@4 secret put STATS_PASSWORD
          else
            echo "::warning::No STATS_PASSWORD secret: the stats page stays locked."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### User counter is live: $url (sign in with any name and your STATS_PASSWORD)" >> "$GITHUB_STEP_SUMMARY"

      # From outside, without adding a user: the page wants the password, the password opens it,
      # and a bad count is refused. (A new workers.dev address can take a minute to answer.)
      - name: Check the user counter
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
        run: |
          for i in $(seq 1 18); do
            locked=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            [ "$locked" = 401 ] && break
            sleep 10
          done
          opened=$(curl -s -o page.json -w '%{http_code}' -u "owner:$STATS_PASSWORD" "$URL/stats.json")
          refused=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/ping" -d '{"id":"x"}')
          badcrash=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/crash" -d '{"id":"x","type":"crash","report":"x"}')
          crashes=$(grep -c '"crashes"' page.json || true)
          rm -f page.json
          if [ "$locked" = 401 ] && [ "$opened" = 200 ] && [ "$refused" = 400 ] && [ "$badcrash" = 400 ] && [ "$crashes" = 1 ]; then
            echo "::notice::User counter OK at $URL: locked without the password, opens with it, refuses bad counts and bad crash reports, lists crash reports."
          else
            echo "::error::User counter check: without password $locked (want 401), with password $opened (want 200), bad count $refused (want 400), bad crash report $badcrash (want 400), crash list $crashes (want 1)."
          fi

  build:
    needs: stats
    # Builds even when the counter is skipped (other branches) or couldn't deploy.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      STATS_URL: ${{ needs.stats.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Only the app: the APK that the app's own updates install.
      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleGithubRelease -PstatsUrl="$STATS_URL" --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|requires|Dependency '" -A4 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Name the APK
        run: |
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/github/release/*.apk "out/ThePlayer-$VNAME-build${{ github.run_number }}.apk"
          ls -la out

      # Torrent links (8.16): the app must carry libtorrent for both kinds of device, and the code that
      # the library calls back into must survive the shrinker. A build without them would only fail on a device.
      - name: Check the torrent library is in the APK
        run: |
          APK=$(ls out/*.apk | head -1)
          unzip -l "$APK" | grep -E "lib/.*/libtorrent4j\.so" | awk '{print "::notice::" $4 " " $1 " bytes"}'
          for abi in armeabi-v7a arm64-v8a; do
            unzip -l "$APK" | grep -q "lib/$abi/libtorrent4j.so" || { echo "::error::lib/$abi/libtorrent4j.so is missing from the APK"; exit 1; }
          done
          mkdir -p dexcheck && unzip -q -o "$APK" 'classes*.dex' -d dexcheck
          grep -l "Lorg/libtorrent4j/swig/libtorrent_jni;" dexcheck/classes*.dex >/dev/null || { echo "::error::org.libtorrent4j.swig.libtorrent_jni is missing from the APK's code"; exit 1; }
          echo "::notice::torrent library and its Java side are in the APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ThePlayer-build
          path: out/*

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --target "${{ github.sha }}" \
            --title "The Player $VNAME (build ${{ github.run_number }})" \
            --notes-file notes.txt \
            --latest

  # Draws the main screens with sample data (Robolectric) and publishes them to the
  # "screenshots" branch, for reviewing layout without a device. Never blocks a release.
  screens:
    # Pinned: since ubuntu-latest moved to Ubuntu 26, the screen tests sometimes hang there.
    runs-on: ubuntu-24.04
    continue-on-error: true
    # A stuck screen test must not hold a runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric's own download of its Android jar (~150 MB) kept failing ("Failed to fetch maven
      # artifact"), taking whole test classes with it. Kept between runs, and fetched here with retries;
      # Robolectric uses a jar already in ~/.m2. (The version follows Robolectric 4.15.1 and SDK 35.)
      - name: Keep Robolectric's Android jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-android-all-15-robolectric-12650502-i7

      - name: Fetch Robolectric's Android jar (retried)
        continue-on-error: true
        run: |
          v=15-robolectric-12650502-i7
          d=~/.m2/repository/org/robolectric/android-all-instrumented/$v
          base=https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/$v/android-all-instrumented-$v
          mkdir -p "$d"
          for i in 1 2 3 4 5 6; do
            if [ -s "$d/android-all-instrumented-$v.jar" ]; then break; fi
            if curl -fsSL --retry 3 -o /tmp/aa.jar "$base.jar" && curl -fsSL --retry 3 -o /tmp/aa.sha512 "$base.jar.sha512" \
               && [ "$(sha512sum /tmp/aa.jar | cut -d' ' -f1)" = "$(cut -d' ' -f1 /tmp/aa.sha512)" ]; then
              mv /tmp/aa.jar "$d/android-all-instrumented-$v.jar"
              curl -fsSL --retry 3 -o "$d/android-all-instrumented-$v.pom" "$base.pom" || true
            else
              echo "try $i failed"; sleep 15
            fi
          done
          ls -la "$d"

      - name: Check the speech model download
        # Auto captions download this model on the device: is it there, whole, with the SHA-256 the app checks?
        continue-on-error: true
        run: |
          base=https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06/resolve/main
          for f in tokens.txt joiner.onnx decoder.onnx encoder.onnx; do
            sha=$(curl -sI "$base/$f" | tr -d '\r' | awk 'tolower($1)=="x-linked-etag:" {print $2}' | tr -d '"')
            code=$(curl -sL -o "/tmp/$f" -w '%{http_code}' "$base/$f")
            size=$(stat -c %s "/tmp/$f" 2>/dev/null || echo 0)
            got=$(sha256sum "/tmp/$f" | cut -d' ' -f1)
            # The app checks the tag of a redirected (large) file only; a small file's tag isn't a SHA-256.
            redirect=$(curl -sI "$base/$f" | head -1 | awk '{print $2}')
            if [ -z "$sha" ]; then check="no tag given (not checked)"; elif [ "$sha" = "$got" ]; then check="SHA-256 matches"; elif [ "$redirect" = "302" ]; then check="SHA-256 MISMATCH"; else check="served directly, tag not a SHA-256 (not checked by the app)"; fi
            echo "::notice::Speech model $f: HTTP $code, $size bytes, $check"
            rm -f "/tmp/$f"
          done

      - name: Draw the screens
        continue-on-error: true
        # A full run takes 12 to 20 minutes; a stuck test is cut off here (the log's tail says which).
        timeout-minutes: 32
        run: |
          chmod +x gradlew
          # A quick run of some tests only: "[only app.falak.player.torrent.*]" in the commit's first line.
          only=$(git log -1 --format=%s | sed -n 's/.*\[only \([^]]*\)\].*/\1/p')
          if [ -n "$only" ]; then
            export TORRENT_TEST_REPEAT=6
            # Tests that ask a real site (SkipSegmentsLiveTest) run only when asked for like this.
            export LIVE_CHECKS=1
            # A crash in native code leaves its memory behind, for gdb to say where (below).
            sudo sysctl -q -w kernel.core_pattern=/tmp/core.%p || true
            ulimit -c unlimited || true
          fi
          # (Several, separated by spaces: "[only *GuideScreens *TitleMatch*]".)
          picks=()
          set -f
          for t in $only; do picks+=(--tests "$t"); done
          set +f
          ./gradlew testPlayDebugUnitTest "${picks[@]}" --no-daemon --stacktrace 2>&1 | tee screens.log | tail -60

      # Android's own code check over every file, when "[lint]" is in the commit's first line (its
      # findings go to the screenshots branch as lint-results-*.xml).
      - name: Check the code (lint)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if git log -1 --format=%s | grep -q '\[lint\]'; then
            ./gradlew lintGithubDebug --no-daemon 2>&1 | tail -30
          fi

      # main's screens go to "screenshots"; another branch's (work in progress) to "screenshots-<branch>".
      - name: Publish to the screenshots branch
        if: always()
        env:
          TARGET: ${{ github.ref == 'refs/heads/main' && 'screenshots' || format('screenshots-{0}', github.ref_name) }}
        run: |
          mkdir -p /tmp/screens
          cp app/build/screens/*.png /tmp/screens/ 2>/dev/null || true
          # Where a hung test was stuck (see ScreenshotBase.watched).
          cp app/build/screens/hang-*.txt /tmp/screens/ 2>/dev/null || true
          # Compile errors first, then the end of the run (the last test started is the one that stuck).
          { grep -E "^e: |^w: .*screens" screens.log | head -40; echo "----- last lines -----"; grep -E "STARTED|PASSED|FAILED|SKIPPED|Exception|Error:|at app\.falak|Caused by" screens.log | tail -120; } > /tmp/screens/log.txt || true
          find app/build/test-results -name "*.xml" -exec cp {} /tmp/screens/ \; 2>/dev/null || true
          cp app/build/reports/lint-results*.xml /tmp/screens/ 2>/dev/null || true
          # A test that crashed in native code (the torrent library): where, from Java's own crash report.
          find . /tmp -maxdepth 4 -name "hs_err_pid*.log" 2>/dev/null | head -3 | while read -r f; do head -150 "$f" > "/tmp/screens/crash-$(basename "$f" .log).txt"; done || true
          grep -n -B2 -A12 "^# \|fatal error\|exit value 13" screens.log | head -120 > /tmp/screens/crash-log.txt || true
          [ -s /tmp/screens/crash-log.txt ] || rm -f /tmp/screens/crash-log.txt
          core=$(ls /tmp/core.* 2>/dev/null | head -1)
          if [ -n "$core" ]; then
            which gdb >/dev/null 2>&1 || sudo apt-get install -y -q gdb >/dev/null 2>&1 || true
            java=$(file "$core" | sed -n "s/.*execfn: '\([^']*\)'.*/\1/p")
            { ls -la /tmp/core.*; echo "java: $java"; gdb -batch -ex "p \$_siginfo.si_signo" -ex "p \$_siginfo.si_code" -ex "p \$_siginfo._sifields" -ex "info registers rip rsp rax" -ex "x/6i \$pc" -ex "x/48ga \$sp" -ex "bt 40" -ex "info sharedlibrary" -ex "thread apply all bt 12" "${java:-java}" "$core" 2>&1 | grep -v "^\[New LWP\|^warning" | head -500; } > /tmp/screens/crash-gdb.txt || true
          fi
          cd /tmp/screens
          git init -q
          git checkout -q -b "$TARGET"
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -q -m "Screens for build ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$TARGET"

  # Device check (8.54): the app (a release-speed "bench" build) on an Android phone and an Android TV
  # emulator, walked through its pages against a made-up provider (tools/device), keeping the screens,
  # frame timings, memory and crash / not-responding logs. Only when the commit's first line has [device].
  # Emulators draw with the processor (SwiftShader), so frame times are far slower than a real device's:
  # they compare pages and versions, they don't say how a real TV box feels.
  device:
    if: contains(github.event.head_commit.message, '[device]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - form: phone
            api: 34
            target: google_apis
            arch: x86_64
            profile: pixel_6
          - form: tv
            api: 30
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the bench app
        env:
          VERSION_CODE: "999999"
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubBench --no-daemon -q 2>&1 | tail -20
          ls -la app/build/outputs/apk/github/bench/
          unzip -l app/build/outputs/apk/github/bench/*.apk | grep -c "lib/x86" || true

      - name: Make the test provider's videos and pictures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install --quiet pillow
          mkdir -p media
          python3 tools/device/make_media.py media
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 600 -c:v libx264 -preset ultrafast -b:v 900k -g 50 -c:a aac -b:a 96k -f mpegts media/live.ts
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=24 -f lavfi -i sine=frequency=330:sample_rate=48000 \
            -t 90 -c:v libx264 -preset veryfast -b:v 3M -c:a aac -b:a 128k -movflags +faststart media/film.mp4
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=24 -f lavfi -i sine=frequency=550:sample_rate=48000 \
            -t 40 -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -c:a aac -b:a 128k media/film-hevc.mkv
          ls -la media

      - name: Start the test provider
        run: |
          # [big] (8.57): a big provider, and timing.sh instead of the walk.
          SCALE=${{ contains(github.event.head_commit.message, '[big]') && '8' || '1' }} nohup python3 tools/device/server.py media 8080 > server.log 2>&1 &
          sleep 10
          curl -s "http://127.0.0.1:8080/player_api.php?username=u&password=p" | head -c 120; echo

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk the app (${{ matrix.form }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disk-size: 6G
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/device/${{ contains(github.event.head_commit.message, '[big]') && 'timing' || 'walk' }}.sh ${{ matrix.form }} app/build/outputs/apk/github/bench/app-github-bench.apk out-${{ matrix.form }}

      # Also on a branch (device-phone / device-tv): the artifacts' storage can't be reached from every place
      # the results are read from.
      - name: Publish to the device branch
        if: always()
        run: |
          mkdir -p /tmp/dev && cp -r out-${{ matrix.form }}/. /tmp/dev/ 2>/dev/null || true
          cp server.log /tmp/dev/ 2>/dev/null || true
          cd /tmp/dev
          git init -q
          git checkout -q -b "device-${{ matrix.form }}"
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -q -m "Device check ${{ matrix.form }}, run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "device-${{ matrix.form }}"

      - name: Keep what it saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-${{ matrix.form }}
          path: |
            out-${{ matrix.form }}
            server.log
          retention-days: 14
