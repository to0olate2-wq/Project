name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases (one-tap updates read the latest release)

jobs:
  # The user counter (stats/), deployed to the owner's Cloudflare account when the repository has
  # the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (STATS_PASSWORD locks its page).
  # Without them nothing is deployed and the app is built without counting.
  stats:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy the user counter
        id: deploy
        continue-on-error: true
        working-directory: stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet: the user counter isn't deployed and the app counts nothing."
            exit 0
          fi
          # A new Cloudflare account has no workers.dev address yet: make one.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            sub="theplayer-$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -c1-8)"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$sub\"}" "$api" | jq -c '{success, errors}'
          fi
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::The user counter didn't deploy: check the Cloudflare token and account ID."
            exit 1
          fi
          if [ -n "$STATS_PASSWORD" ]; then
            printf '%s' "$STATS_PASSWORD" | npx --yes wrangler@4 secret put STATS_PASSWORD
          else
            echo "::warning::No STATS_PASSWORD secret: the stats page stays locked."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### User counter is live: $url (sign in with any name and your STATS_PASSWORD)" >> "$GITHUB_STEP_SUMMARY"

      # From outside, without adding a user: the page wants the password, the password opens it,
      # and a bad count is refused. (A new workers.dev address can take a minute to answer.)
      - name: Check the user counter
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.url }}
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
        run: |
          for i in $(seq 1 18); do
            locked=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            [ "$locked" = 401 ] && break
            sleep 10
          done
          opened=$(curl -s -o page.json -w '%{http_code}' -u "owner:$STATS_PASSWORD" "$URL/stats.json")
          refused=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/ping" -d '{"id":"x"}')
          badcrash=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/crash" -d '{"id":"x","type":"crash","report":"x"}')
          crashes=$(grep -c '"crashes"' page.json || true)
          rm -f page.json
          if [ "$locked" = 401 ] && [ "$opened" = 200 ] && [ "$refused" = 400 ] && [ "$badcrash" = 400 ] && [ "$crashes" = 1 ]; then
            echo "::notice::User counter OK at $URL: locked without the password, opens with it, refuses bad counts and bad crash reports, lists crash reports."
          else
            echo "::error::User counter check: without password $locked (want 401), with password $opened (want 200), bad count $refused (want 400), bad crash report $badcrash (want 400), crash list $crashes (want 1)."
          fi

  build:
    needs: stats
    # Builds even when the counter is skipped (other branches) or couldn't deploy.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      STATS_URL: ${{ needs.stats.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Google Play upload key, from the repository's secrets (Settings → Secrets and variables → Actions).
      # Without it the Play bundle is built unsigned.
      - name: Play upload key
        env:
          PLAY_KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_B64 }}
        run: |
          if [ -n "$PLAY_KEYSTORE_B64" ]; then
            echo "$PLAY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PLAY_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Play bundle will be signed with the upload key."
          else
            echo "::notice::No PLAY_KEYSTORE_B64 secret: the Play bundle is built unsigned."
          fi

      - name: Build APK (GitHub) and bundle (Google Play)
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleGithubRelease bundlePlayRelease -PstatsUrl="$STATS_URL" --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|requires|Dependency '" -A4 build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Name the APK and bundle
        run: |
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VNAME=$VNAME" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/github/release/*.apk "out/ThePlayer-$VNAME-build${{ github.run_number }}.apk"
          SUFFIX=play
          [ -n "$PLAY_KEYSTORE_FILE" ] || SUFFIX=play-unsigned
          cp app/build/outputs/bundle/playRelease/*.aab "out/ThePlayer-$VNAME-build${{ github.run_number }}-$SUFFIX.aab"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ThePlayer-build
          path: out/*

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.txt
          gh release create "build-${{ github.run_number }}" out/*.apk out/*.aab \
            --target "${{ github.sha }}" \
            --title "The Player $VNAME (build ${{ github.run_number }})" \
            --notes-file notes.txt \
            --latest

  # Draws the main screens with sample data (Robolectric) and publishes them to the
  # "screenshots" branch, for reviewing layout without a device. Never blocks a release.
  screens:
    runs-on: ubuntu-latest
    continue-on-error: true
    # A stuck screen test must not hold a runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the speech model download
        # Auto captions download this model on the device: is it there, whole, with the SHA-256 the app checks?
        continue-on-error: true
        run: |
          base=https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06/resolve/main
          for f in tokens.txt joiner.onnx decoder.onnx encoder.onnx; do
            sha=$(curl -sI "$base/$f" | tr -d '\r' | awk 'tolower($1)=="x-linked-etag:" {print $2}' | tr -d '"')
            code=$(curl -sL -o "/tmp/$f" -w '%{http_code}' "$base/$f")
            size=$(stat -c %s "/tmp/$f" 2>/dev/null || echo 0)
            got=$(sha256sum "/tmp/$f" | cut -d' ' -f1)
            # The app checks the tag of a redirected (large) file only; a small file's tag isn't a SHA-256.
            redirect=$(curl -sI "$base/$f" | head -1 | awk '{print $2}')
            if [ -z "$sha" ]; then check="no tag given (not checked)"; elif [ "$sha" = "$got" ]; then check="SHA-256 matches"; elif [ "$redirect" = "302" ]; then check="SHA-256 MISMATCH"; else check="served directly, tag not a SHA-256 (not checked by the app)"; fi
            echo "::notice::Speech model $f: HTTP $code, $size bytes, $check"
            rm -f "/tmp/$f"
          done

      - name: Draw the screens
        continue-on-error: true
        # A full run takes about 10 minutes; a stuck test is cut off here (the log's tail says which).
        timeout-minutes: 18
        run: |
          chmod +x gradlew
          ./gradlew testPlayDebugUnitTest --no-daemon --stacktrace 2>&1 | tee screens.log | tail -60

      - name: Publish to the screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/screens
          cp app/build/screens/*.png /tmp/screens/ 2>/dev/null || true
          # Compile errors first, then the end of the run (the last test started is the one that stuck).
          { grep -E "^e: |^w: .*screens" screens.log | head -40; echo "----- last lines -----"; grep -E "STARTED|PASSED|FAILED|SKIPPED|Exception|Error:|at app\.falak|Caused by" screens.log | tail -120; } > /tmp/screens/log.txt || true
          find app/build/test-results -name "*.xml" -exec cp {} /tmp/screens/ \; 2>/dev/null || true
          cd /tmp/screens
          git init -q
          git checkout -q -b screenshots
          git add -A
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -q -m "Screens for build ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
